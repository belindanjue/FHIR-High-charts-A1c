<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FHIR-Hemoglobin A1c Highchart</title>

  <!-- Internal styles -->
  <style>
    :root{
      --bg:#0f1320;
      --panel:#151a28;
      --ink:#e9eef7;
      --muted:#a7b0c2;
      --accent:#5ac8fa;
      --radius:16px;
      --shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    *{ box-sizing: border-box }
    html, body { height:100% }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at -10% -10%, rgba(90,200,250,.12), transparent 60%),
        radial-gradient(900px 600px at 110% 10%, rgba(167,139,250,.10), transparent 60%),
        var(--bg);
      line-height:1.55;
    }
    .wrap{
      max-width:1100px;
      margin: clamp(16px, 4vw, 36px) auto;
      padding: 0 clamp(12px, 3vw, 24px);
    }
    header{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      margin-bottom:16px;
    }
    h1{
      margin:.2rem 0 0;
      font-size: clamp(1.25rem, 1rem + 1.6vw, 2rem);
      font-weight: 800;
      letter-spacing:.3px;
    }
    .sub{
      color:var(--muted);
      margin-top:6px;
    }
    .pill{
      display:inline-block;
      margin-top:8px;
      padding:.28rem .6rem;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      color:var(--muted);
      background: rgba(255,255,255,.03);
      font-size:.85rem;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)) , var(--panel);
      border-radius: var(--radius);
      border:1px solid rgba(255,255,255,.06);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card-head{
      display:flex; align-items:center; justify-content:space-between;
      padding: 12px 14px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(90,200,250,.08), transparent 80%);
    }
    .card-head h2{ margin:0; font-size:1rem }
    .card-body{ padding: 14px }
    #container{
      width: 100%;
      height: clamp(340px, 55vh, 600px);
      border-radius:12px;
    }
    footer{
      margin-top:16px; color:var(--muted); font-size:.92rem;
    }
    code.k{
      padding:.15rem .4rem; background:#0e1424;
      border:1px solid rgba(255,255,255,.06); border-radius:6px;
    }
  </style>
