<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FHIR-Hemoglobin A1c Highchart</title>

  <!-- Internal styles -->
  <style>
    :root{
      --bg:#0f1320;
      --panel:#151a28;
      --ink:#e9eef7;
      --muted:#a7b0c2;
      --accent:#5ac8fa;
      --radius:16px;
      --shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    *{ box-sizing: border-box }
    html, body { height:100% }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at -10% -10%, rgba(90,200,250,.12), transparent 60%),
        radial-gradient(900px 600px at 110% 10%, rgba(167,139,250,.10), transparent 60%),
        var(--bg);
      line-height:1.55;
    }
    .wrap{
      max-width:1100px;
      margin: clamp(16px, 4vw, 36px) auto;
      padding: 0 clamp(12px, 3vw, 24px);
    }
    header{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      margin-bottom:16px;
    }
    h1{
      margin:.2rem 0 0;
      font-size: clamp(1.25rem, 1rem + 1.6vw, 2rem);
      font-weight: 800;
      letter-spacing:.3px;
    }
    .sub{
      color:var(--muted);
      margin-top:6px;
    }
    .pill{
      display:inline-block;
      margin-top:8px;
      padding:.28rem .6rem;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      color:var(--muted);
      background: rgba(255,255,255,.03);
      font-size:.85rem;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)) , var(--panel);
      border-radius: var(--radius);
      border:1px solid rgba(255,255,255,.06);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card-head{
      display:flex; align-items:center; justify-content:space-between;
      padding: 12px 14px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(90,200,250,.08), transparent 80%);
    }
    .card-head h2{ margin:0; font-size:1rem }
    .card-body{ padding: 14px }
    #container{
      width: 100%;
      height: clamp(340px, 55vh, 600px);
      border-radius:12px;
    }
    footer{
      margin-top:16px; color:var(--muted); font-size:.92rem;
    }
    code.k{
      padding:.15rem .4rem; background:#0e1424;
      border:1px solid rgba(255,255,255,.06); border-radius:6px;
    }
  </style>

  <!-- FHIR client and Highcharts (CDNs) -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Hemoglobin A1c Trend (Highcharts)</h1>
        <div class="sub">
          Visualizing A1c from FHIR <code class="k">Observation</code> — LOINC <code class="k">4548-4</code> (units: %)
        </div>
        <span class="pill" id="pointBadge">0 points</span>
      </div>
      <div>
        <button id="loadDemo" style="
          appearance:none;border:1px solid rgba(255,255,255,.1);
          background:linear-gradient(135deg, rgba(90,200,250,.18), rgba(167,139,250,.18));
          color:var(--ink); padding:.6rem .8rem; border-radius:10px;
          font-weight:700; cursor:pointer; box-shadow:var(--shadow);
        ">Load Demo Data</button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>Chart</h2>
        <span class="pill">Source: FHIR or Demo</span>
      </div>
      <div class="card-body">
        <div id="container" role="img" aria-label="Hemoglobin A1c line chart"></div>
      </div>
    </section>

    <footer>
      Tip: Replace the demo loader with your FHIR fetch. Map
      <code class="k">effectiveDateTime</code> → date (x) and
      <code class="k">valueQuantity.value</code> → A1c % (y).
    </footer>
  </div>

  <script>
    // Initialize Highcharts
    const chart = Highcharts.chart('container', {
      chart: { type: 'line', backgroundColor: 'transparent' },
      title: { text: 'Hemoglobin A1c (%)' },
      subtitle: { text: 'LOINC 4548-4' },
      xAxis: { type: 'datetime', crosshair: true, tickPixelInterval: 120 },
      yAxis: {
        title: { text: 'A1c (%)' },
        min: 4, max: 14,
        plotBands: [
          { // Target range 6.5–7.5 (example)
            from: 6.5, to: 7.5, color: 'rgba(90,200,250,0.08)', label: { text: 'Typical target', style:{ color:'#cfe9f7' } }
          }
        ]
      },
      tooltip: {
        shared: true,
        xDateFormat: '%Y-%m-%d',
        pointFormat: '<span style="font-weight:bold">A1c:</span> {point.y:.1f}%<br/>'
      },
      legend: { enabled: false },
      series: [{
        name: 'A1c',
        data: [] // populated later
      }],
      credits: { enabled: false }
    });

    const pointBadge = document.getElementById('pointBadge');
    function setSeries(points){
      chart.series[0].setData(points, true, { duration: 300 });
      pointBadge.textContent = `${points.length} point${points.length === 1 ? '' : 's'}`;
    }

    // --- Demo data fallback
    function loadDemo(){
      const demo = [
        ['2024-08-12', 8.1],
        ['2024-11-03', 7.6],
        ['2025-02-17', 7.2],
        ['2025-05-29', 7.8],
        ['2025-09-14', 7.1]
      ].map(([d, y]) => [Date.parse(d), y]);
      setSeries(demo);
    }
    document.getElementById('loadDemo').addEventListener('click', loadDemo);

    // --- Attempt FHIR fetch (if context is available)
    // Queries A1c Observations (LOINC 4548-4). Adjust if your server uses 4548-4 or 17856-6 etc.
    // This will silently fail if not in a SMART-on-FHIR launch.
    (function tryFHIR(){
      if (!window.FHIR || !FHIR.oauth2) return; // no fhirclient loaded
      try {
        FHIR.oauth2.ready(async client => {
          // If no patient is in context, skip to demo
          if (!client.patient || !client.getPatientId) { return; }

          const patientId = client.getPatientId();
          // Query Observations for A1c (LOINC 4548-4). Change if needed.
          const bundle = await client.request(
            `Observation?patient=${encodeURIComponent(patientId)}&code=http://loinc.org|4548-4&_sort=date`,
            { flat: false }
          );

          if (!bundle || !bundle.entry || !bundle.entry.length) {
            // No points found; keep empty (or load demo if you prefer)
            return;
          }

          const pts = [];
          for (const e of bundle.entry) {
            const o = e.resource;
            const t = (o.effectiveDateTime || (o.effectivePeriod && o.effectivePeriod.start));
            const v = o.valueQuantity && o.valueQuantity.value;
            if (t && typeof v === 'number') {
              pts.push([Date.parse(t), v]);
            }
          }
          // Sort by date ascending
          pts.sort((a,b)=>a[0]-b[0]);
          if (pts.length) setSeries(pts);
        });
      } catch (e) {
        // Not in a SMART launch or failed request; ignore and let user click Demo
      }
    })();
  </script>
</body>
</html>
